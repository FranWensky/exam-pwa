<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сессия">
  <meta name="description" content="Конспекты, билеты и карточки для подготовки к экзаменам.">
  <title>Сессия — подготовка к экзаменам</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <script>
    try {
      const theme = localStorage.getItem("sessia.theme");
      if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Сессия, главная">
        <img src="./icon-192.png" alt="" width="36" height="36">
        <span>Сессия</span>
      </a>
      <button id="theme" class="icon-button" type="button" aria-label="Переключить тему"></button>
    </header>
    <main id="app" aria-busy="true">
      <p class="empty" role="status">Загружаем материалы…</p>
    </main>
    <nav class="dock" aria-label="Навигация">
      <a id="nav-home" href="#/"><span class="dock-icon" aria-hidden="true">▦</span> Предметы</a>
      <a id="nav-settings" href="#/settings"><span class="dock-icon" aria-hidden="true">⚙</span> Настройки</a>
    </nav>
  </div>
  <noscript>Включите JavaScript, чтобы открыть материалы и карточки.</noscript>
</body>
</html>
