<rect x="0" y="0" width="1200" height="510" rx="0" fill="#f0f4f8" stroke="none"/><text x="46" y="64" fill="#182639" font-size="38" font-weight="700" text-anchor="start">Скалярное произведение и проекция</text>
<g transform="translate(40 99)"><rect x="0" y="0" width="550" height="371" rx="0" fill="#fff" stroke="#d2deeb"/><text x="24" y="42" fill="#182639" font-size="27" font-weight="700" text-anchor="start">Угол и проекция на направление a</text><path d="M73,249 L476,249" fill="none" stroke="#2056a3" stroke-width="4" marker-end="url(#tip-2056a3)"/><path d="M73,249 L345,104" fill="none" stroke="#00796f" stroke-width="4" marker-end="url(#tip-00796f)"/><path d="M345,104 L345,249" fill="none" stroke="#50637d" stroke-width="2" stroke-dasharray="7 6"/><path d="M73,249 L345,249" fill="none" stroke="#a74412" stroke-width="4"/><path d="M330,249 L330,235" fill="none" stroke="#50637d" stroke-width="2"/><path d="M330,235 L345,235" fill="none" stroke="#50637d" stroke-width="2"/><path d="M138,249 A65,65 0 0,0 130,219" fill="none" stroke="#a74412" stroke-width="3" marker-end="url(#tip-a74412)"/><circle cx="73" cy="249" r="5" fill="#182639"/><text x="150" y="239" fill="#a74412" font-size="25" font-weight="400" text-anchor="start">α</text><text x="473" y="278" fill="#2056a3" font-size="28" font-weight="700" text-anchor="start">a</text><text x="346" y="96" fill="#00796f" font-size="28" font-weight="700" text-anchor="start">b</text><text x="128" y="283" fill="#a74412" font-size="25" font-weight="400" text-anchor="start">|b| cos α</text><text x="24" y="335" fill="#182639" font-size="25" font-weight="700" text-anchor="start">a · b = |a| · (|b| cos α).</text></g><g transform="translate(610 99)"><rect x="0" y="0" width="550" height="371" rx="0" fill="#fff" stroke="#d2deeb"/><text x="24" y="42" fill="#182639" font-size="27" font-weight="700" text-anchor="start">Перпендикулярные векторы</text><path d="M122,248 L456,248" fill="none" stroke="#2056a3" stroke-width="4" marker-end="url(#tip-2056a3)"/><path d="M122,248 L122,92" fill="none" stroke="#00796f" stroke-width="4" marker-end="url(#tip-00796f)"/><path d="M122,223 L147,223" fill="none" stroke="#a74412" stroke-width="2"/><path d="M147,223 L147,248" fill="none" stroke="#a74412" stroke-width="2"/><circle cx="122" cy="248" r="5" fill="#182639"/><text x="166" y="215" fill="#a74412" font-size="25" font-weight="400" text-anchor="start">90°</text><text x="457" y="276" fill="#2056a3" font-size="28" font-weight="700" text-anchor="start">a</text><text x="91" y="95" fill="#00796f" font-size="28" font-weight="700" text-anchor="start">b</text><text x="24" y="313" fill="#182639" font-size="25" font-weight="400" text-anchor="start">cos 90° = 0, поэтому a · b = 0.</text><text x="24" y="345" fill="#50637d" font-size="22" font-weight="400" text-anchor="start">Для ненулевых векторов верно и обратное.</text></g>
</svg>
